<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股每日复盘 · 盘前 / 盘中 / 盘后</title>
  <style>
  :root{
    --up:#c02a2a; --down:#2f7d4f; --bg:#FBFBF6; --card:#FFFFFF;          /* 玉色底 */
    --ink:#1f2937; --sub:#7a7d85; --line:#EAEEF1; --accent:#1f3a5f;       /* 浅云边·墨蓝 */
    --warn:#a87a00; --ok:#2f7d4f; --bad:#c02a2a;
    --qian:#5a3e8a; --zhong:#a87a00; --hou:#1f3a5f; --gold:#a87a00;       /* 三时段色：沉紫·金·墨蓝 */
    --shadow-sm:0 1px 4px rgba(31,58,95,.05),0 0 0 1px rgba(214,224,236,.18);
    --shadow-md:0 4px 14px rgba(31,58,95,.06),0 2px 6px rgba(31,58,95,.04);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.72;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .top{position:sticky;top:0;z-index:20;background:rgba(251,251,246,.92);backdrop-filter:blur(10px);  /* 玉色 */
    border-bottom:1px solid var(--line);padding:12px 16px 10px;box-shadow:0 1px 0 rgba(31,58,95,.03);}
  .top h1{font-size:16px;margin:0 0 10px;font-weight:700;letter-spacing:.2px;color:#1f3a5f;}
  .top h1 .muted{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:8px;letter-spacing:0;}
  .nav{display:flex;gap:8px;flex-wrap:wrap;}
  .dbtn{border:1px solid var(--line);background:#FFFFFF;color:var(--ink);border-radius:999px;
    padding:6px 15px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s ease;}
  .dbtn:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
  .dbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm);}
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 72px;}
  /* ==== Hero · 中国传统色·白色系 ==== */
  .hero{background:linear-gradient(135deg,#FBFBF6 0%,#F4F4FF 55%,#E6E6F6 100%);   /* 玉色→东方亮→雪白 */
    color:#1f3a5f;border:1px solid #EAEEF1;border-radius:18px;padding:20px 22px;
    margin-bottom:12px;box-shadow:0 1px 4px rgba(31,58,95,.05),0 0 0 1px rgba(214,224,236,.18);}
  .hero .tag{display:inline-block;font-size:12px;
    background:linear-gradient(135deg,#E8D0D5 0%,#ECE6D8 100%);   /* 岩石→沙白 */
    color:#7a3a3a;padding:3px 10px;border-radius:999px;letter-spacing:.3px;
    border:1px solid #C2A8AB;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .hero h2{font-size:21px;margin:9px 0 2px;line-height:1.38;font-weight:700;letter-spacing:.2px;color:#1f3a5f;
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;}
  .tags{margin:7px 0 11px;}
  .pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:#eef1f4;color:#374151;margin:0 5px 5px 0;letter-spacing:.2px;}
  .pill.hot{background:#fdeaea;color:var(--up);}
  .pill.cold{background:#e7f8ef;color:var(--down);}

  /* 三标签 */
  .tabs{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;}
  .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;
    padding:9px 19px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;transition:all .15s ease;}
  .tab:hover:not(.disabled){box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .tab .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .tab[data-k="panqian"] .dot{background:var(--qian);}
  .tab[data-k="panzhong"] .dot{background:var(--zhong);}
  .tab[data-k="panhou"] .dot{background:var(--hou);}
  .tab.active[data-k="panqian"]{border-color:var(--qian);color:var(--qian);background:#faf5ff;box-shadow:0 0 0 3px rgba(125,60,181,.1);}
  .tab.active[data-k="panzhong"]{border-color:var(--zhong);color:var(--zhong);background:#fff7ed;box-shadow:0 0 0 3px rgba(194,65,12,.1);}
  .tab.active[data-k="panhou"]{border-color:var(--hou);color:var(--hou);background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.1);}
  .tab[data-k="gold"] .dot{background:var(--gold);}
  .tab.active[data-k="gold"]{border-color:var(--gold);color:var(--gold);background:#fdf8ec;box-shadow:0 0 0 3px rgba(168,122,0,.12);}
  .tab.disabled{color:var(--sub);background:#f3f4f6;cursor:not-allowed;border-style:dashed;font-weight:400;font-size:12.5px;}

  .mod{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);border:1px solid rgba(16,24,40,.03);}
  .ch{font-size:15px;font-weight:700;padding:4px 0 10px 11px;margin-bottom:10px;border-left:3px solid var(--line);border-bottom:none;color:#111827;}
  .ch.qian{border-left-color:var(--qian);color:var(--qian);}
  .ch.zhong{border-left-color:var(--zhong);color:var(--zhong);}
  .ch.hou{border-left-color:var(--hou);color:var(--hou);}
  .empty{color:var(--sub);font-size:13px;padding:14px 0;text-align:center;}

  h3{font-size:14.5px;margin:16px 0 7px;color:#111827;font-weight:600;}
  p{margin:8px 0;}
  .muted{color:var(--sub);font-size:13px;}
  .up{color:var(--up);font-weight:600;}
  .down{color:var(--down);font-weight:600;}
  .ok{color:var(--ok);font-weight:600;}
  .bad{color:var(--bad);font-weight:600;}
  .flat{color:var(--sub);}
  table{width:100%;border-collapse:separate;border-spacing:0;margin:11px 0;font-size:13px;}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  thead th{background:#f7f8fa;color:var(--sub);font-weight:600;font-size:12px;}
  thead th:first-child{border-top-left-radius:8px;}
  thead th:last-child{border-top-right-radius:8px;}
  tbody tr:nth-child(even){background:#fafbfc;}
  tbody tr:hover{background:#f1f5fd;}
  tbody tr:last-child td{border-bottom:none;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:11px 0;}
  .kv{background:linear-gradient(135deg,#fafbfc,#f2f4f7);border:1px solid var(--line);border-radius:11px;padding:10px 10px;text-align:center;}
  .kv .l{font-size:11.5px;color:var(--sub);}
  .kv .v{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:.2px;}
  .note{border-left:3px solid var(--accent);background:#f3f8ff;padding:9px 13px;border-radius:0 9px 9px 0;font-size:13px;color:#33415c;margin:11px 0;}
  .warnbox{border-left:3px solid var(--warn);background:#fff8ec;padding:9px 13px;border-radius:0 9px 9px 0;font-size:13px;color:#5b3a09;margin:11px 0;}

  /* 盘前：大盘环境 */
  .dapan{border:1px solid #D7E4F2;background:linear-gradient(135deg,#F4F4FF,#FBFBF6);border-radius:13px;padding:13px 15px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}     /* 东方亮→玉色 */
  .dapan .env{font-size:13px;margin:5px 0 7px;}
  .dapan .env .tag2{display:inline-block;font-size:11.5px;background:var(--qian);color:#FBFBF6;padding:2px 10px;border-radius:999px;margin-right:6px;letter-spacing:.3px;border:1px solid #4a2f73;}
  .dapan table{margin:8px 0 0;}
  /* 盘前：隔夜美股 */
  .usm{border:1px solid #c7d2fe;background:linear-gradient(135deg,#eef2ff,#fff);border-radius:13px;padding:13px 15px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}
  .usm .ts{font-size:12px;color:var(--sub);margin-bottom:5px;letter-spacing:.2px;}
  .usm table{margin:6px 0 0;}
  .usm table td:first-child{font-weight:500;}
  .usm .note{font-size:12.5px;color:#3730a3;margin-top:8px;background:#e0e7ff;padding:7px 11px;border-radius:9px;line-height:1.6;}
  /* 盘前：太长不看板（结论先行） */
  .tldr{border:1px solid #D7E4F2;background:linear-gradient(135deg,#F4F4FF,#E6E6F6);border-radius:13px;padding:13px 16px;margin:0 0 13px;box-shadow:var(--shadow-sm);}      /* 东方亮→雪白 */
  .tldr-h{display:inline-block;font-size:12px;font-weight:700;color:#7a3a3a;          /* 砖红字 */
    background:linear-gradient(135deg,#E8D0D5 0%,#ECE6D8 100%);    /* 岩石→沙白 */
    padding:2px 11px;border-radius:999px;margin-bottom:7px;letter-spacing:.3px;
    border:1px solid #C2A8AB;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .tldr-b{font-size:14px;line-height:1.72;color:#1f3a5f;font-weight:500;}             /* 墨蓝 */
  /* 盘前：市场概况（美股+A股+大宗） */
  .pano{border:1px solid #c7d2fe;background:linear-gradient(135deg,#eef2ff,#fff);border-radius:13px;padding:13px 15px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}
  .pano .ts{font-size:12px;color:var(--sub);margin-bottom:7px;letter-spacing:.2px;}
  .pano-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .pano-col{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;}
  .pano-h{font-size:12.5px;font-weight:700;color:#3730a3;margin-bottom:5px;letter-spacing:.2px;}
  .pano table{margin:0;font-size:12.5px;}
  .pano table td{padding:5px 6px;border-bottom:1px solid #eef0f3;text-align:right;}
  .pano table td.pn{text-align:left;font-weight:500;color:#374151;}
  .pano table tr:last-child td{border-bottom:none;}
  .pano .sub{font-size:11px;color:var(--sub);font-weight:400;margin-top:1px;}
  @media(max-width:560px){.pano-grid{grid-template-columns:1fr;}}
  /* 盘前：仓位建议 */
  .posbox{border:1px solid #f0d6a8;background:#fffaf0;border-radius:13px;padding:13px 15px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}
  .posbox .plevel{display:inline-block;font-size:14px;font-weight:700;color:var(--warn);background:#fdeccb;padding:5px 13px;border-radius:9px;margin:2px 0 7px;letter-spacing:.3px;}
  /* 重点个股跟踪 · 美化版（圆角+渐变表头+标签徽章+单元格居中） */
  /* === watch 表格 · 中国传统色·白色系 === */
  .watch{width:100%;border-collapse:separate;border-spacing:0;margin:14px 0 16px;font-size:13px;
    border:1px solid #EAEEF1;       /* 浅云 */
    border-radius:12px;overflow:hidden;
    background:#FBFBF6;             /* 玉色 */
    box-shadow:0 1px 4px rgba(31,58,95,.04),0 0 0 1px rgba(214,224,236,.18);}
  .watch thead th{
    background:linear-gradient(180deg,#D7E4F2 0%,#EAEEF1 100%); /* 月白→浅云 宣纸感 */
    color:#1f3a5f;                  /* 墨蓝 */
    font-weight:700;font-size:12.5px;
    padding:13px 10px;text-align:center;
    border-bottom:1.5px solid #C2C9D0;  /* 云母 */
    letter-spacing:1.2px;white-space:nowrap;
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;}
  .watch thead th:first-child{border-top-left-radius:11px;}
  .watch thead th:last-child{border-top-right-radius:11px;}
  .watch thead th+th{border-left:1px dashed #D7E4F2;}
  .watch tbody td{
    padding:13px 10px;
    border-bottom:1px solid #EAEEF1;   /* 浅云 */
    text-align:center;vertical-align:middle;
    color:#1f2937;
    background:#FFFFFF;}
  .watch tbody tr:nth-child(even) td{background:#FAF9F6;}  /* 深白 */
  .watch tbody tr:hover td{background:#E6E6F6;}            /* 雪白 */
  .watch tbody tr:last-child td{border-bottom:none;}
  /* 个股名 · 东方亮→雪白 渐变 */
  .watch .w-name{display:inline-block;white-space:nowrap;font-size:13.5px;font-weight:700;color:#1f2937;
    background:linear-gradient(135deg,#F4F4FF 0%,#E6E6F6 100%);
    padding:4px 13px;border-radius:6px;border:1px solid #c7c5e6;
    letter-spacing:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  /* 代码 · 浅云底 mono 徽章 */
  .watch .w-code{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;color:#6b7280;background:#EAEEF1;border:1px solid #C2C9D0;
    border-radius:5px;padding:2px 8px;letter-spacing:.4px;white-space:nowrap;}
  /* 跟踪逻辑 / 关键信号 · 长文本左对齐 */
  .watch .w-text{display:block;text-align:left;line-height:1.75;color:#1f2937;font-size:12.5px;padding:0 2px;}
  /* 评级徽章 · 三色渐变胶囊（按色卡） */
  .watch .rate{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 13px;border-radius:7px;
    letter-spacing:.8px;border:1px solid transparent;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55);}
  .watch .rate.ok{background:linear-gradient(135deg,#C9CFC1 0%,#FBFBF6 100%);color:#3d4f3a;border-color:#B7BFB0;}   /* 金白→玉色 */
  .watch .rate.flat{background:linear-gradient(135deg,#D7E4F2 0%,#E6E6F6 100%);color:#1f3a5f;border-color:#B5C7DA;} /* 月白→雪白 */
  .watch .rate.bad{background:linear-gradient(135deg,#E8D0D5 0%,#ECE6D8 100%);color:#7a3a3a;border-color:#C2A8AB;}   /* 岩石→沙白 */
  /* 黄金跟踪模块 */
  .ch.gold{border-left-color:var(--gold);color:var(--gold);}
  .goldmod{border:1px solid #ecd9a8;background:linear-gradient(135deg,#fdf8ec,#fff);border-radius:13px;padding:13px 15px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}
  .gold-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0;}
  .gold-col{background:linear-gradient(135deg,#fdf6e3,#fff);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center;}
  .gold-col .gl{font-size:11.5px;color:var(--sub);}
  .gold-col .gv{font-size:18px;font-weight:700;color:var(--gold);margin-top:3px;letter-spacing:.2px;}
  .gold-col .gs{font-size:11px;color:var(--sub);margin-top:1px;}
  .gold-pos{border:1px solid #ecd9a8;background:#fdf8ec;border-radius:11px;padding:11px 13px;margin:9px 0;}
  .gold-pos .gp-level{display:inline-block;font-size:13px;font-weight:700;color:var(--gold);background:#f6e7be;padding:4px 12px;border-radius:9px;margin-bottom:6px;}
  .gold-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:9px 0;}
  .gl-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;}
  .gl-box .gl-l{font-size:11.5px;color:var(--sub);}
  .gl-box .gl-v{font-size:13.5px;font-weight:700;margin-top:3px;color:#111827;}
  .gold-op{border:1px solid #ecd9a8;background:#fdf8ec;border-radius:11px;padding:11px 13px;margin:9px 0;}
  .gold-op .go-level{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--gold);padding:4px 12px;border-radius:9px;margin-bottom:6px;}
  /* 黄金：走势迷你图 + 白银 + 金银比 */
  .gspark{display:block;width:100%;border:1px solid #ecd9a8;background:linear-gradient(135deg,#fffdf6,#fff);border-radius:11px;padding:7px 9px 0;margin:9px 0 2px;box-sizing:border-box;}
  .gspark-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:3px 9px 8px;}
  .gspark-meta span:nth-child(2){color:#8a6d1f;}
  .silver-row{border:1px solid #d9e2ec;background:linear-gradient(135deg,#f4f8fc,#fff);border-radius:11px;padding:9px 12px;margin:9px 0;font-size:13px;}
  .silver-row .sr-h{font-size:12px;font-weight:700;color:#3b6ea5;margin-bottom:4px;}
  .silver-row .sr-item{display:inline-block;margin-right:16px;}
  .silver-row .sr-item b{color:#111827;font-weight:700;}
  .ratio-badge{border:1px solid #ecd9a8;background:#fdf8ec;border-radius:11px;padding:9px 12px;margin:9px 0;}
  .ratio-badge .rb-h{display:inline-block;font-size:12px;font-weight:700;color:var(--gold);background:#f6e7be;padding:3px 11px;border-radius:999px;margin-right:8px;}
  .ratio-badge .rb-v{font-size:17px;font-weight:800;color:var(--gold);}
  .ratio-badge .rb-note{font-size:12px;color:#5b3a09;margin-top:5px;line-height:1.62;}
  @media(max-width:560px){.gold-grid,.gold-levels{grid-template-columns:1fr;}.silver-row .sr-item{display:block;margin:2px 0;}}
  /* 隔夜美股与重大事件 · 综合板块 */
  .overnight{border:1px solid #c7d2fe;background:linear-gradient(135deg,#eef2ff,#fff);border-radius:13px;padding:13px 15px 16px;margin:7px 0 13px;box-shadow:var(--shadow-sm);}
  .overnight .ts{font-size:12px;color:var(--sub);margin-bottom:8px;letter-spacing:.2px;}
  .overnight-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 12px;}
  .overnight-card{border-radius:12px;padding:13px 8px 11px;background:#f8fafc;border:1px solid var(--line);text-align:center;transition:all .15s ease;}
  .overnight-card:hover{border-color:#c7d2fe;box-shadow:var(--shadow-sm);}
  .overnight-card .oc-n{font-size:13px;color:var(--sub);margin-bottom:5px;letter-spacing:.3px;font-weight:500;}
  .overnight-card .oc-v{font-size:24px;font-weight:700;letter-spacing:.2px;line-height:1.1;}
  .overnight-card .oc-meta{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.35;}
  .overnight-card.up .oc-v{color:#dc2626;}
  .overnight-card.down .oc-v{color:#16a34a;}
  .overnight-card.flat .oc-v{color:var(--sub);}
  .overnight table{margin:4px 0 6px;}
  .overnight table td:first-child{font-weight:500;}
  .overnight-events-h{margin:14px 0 7px;font-size:14px;font-weight:700;color:var(--qian);letter-spacing:.3px;border-left:3px solid var(--qian);padding-left:8px;}
  .overnight .note{font-size:12.5px;color:#3730a3;margin-top:10px;background:#e0e7ff;padding:7px 11px;border-radius:9px;line-height:1.6;}
  @media(max-width:720px){.overnight-cards{grid-template-columns:repeat(2,1fr);}}
  /* 黄金完整曲线图 */
  .gold-chart-wrap{border:1px solid #ecd9a8;background:linear-gradient(135deg,#fffdf6,#fff);border-radius:11px;padding:10px 11px 6px;margin:10px 0 6px;}
  .gold-chart-wrap .gc-head{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#8a6d1f;padding:0 2px 7px;border-bottom:1px dashed #ecd9a8;margin-bottom:6px;}
  .gold-chart-wrap .gc-head .gc-l{font-weight:600;letter-spacing:.3px;}
  .gold-chart-wrap .gc-head .gc-r{font-weight:500;}
  .gold-chart-wrap .gc-head .lc{display:inline-block;width:14px;height:3px;margin-right:4px;vertical-align:middle;border-radius:2px;}
  .gold-chart-wrap .gc-head .gc-gold{background:#a87a00;}
  .gold-chart-wrap .gc-head .gc-silver{background:repeating-linear-gradient(90deg,#6b6b6b 0 4px,transparent 4px 7px);height:2px;}
  .gold-chart-wrap .gc-head .gc-ma{background:repeating-linear-gradient(90deg,#d4a017 0 5px,transparent 5px 8px);height:2px;}
  .gold-chart-wrap .gc-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:5px 2px 4px;}
  /* 黄金异动情况 */
  .gold-anomalies{margin:11px 0 7px;padding:12px 14px 8px;border:1px solid #f6c89f;background:linear-gradient(135deg,#fff7ec,#fff);border-radius:11px;}
  .gold-anomalies .ga-h{font-weight:700;font-size:14px;margin-bottom:7px;color:#a04000;letter-spacing:.3px;border-left:3px solid #f6a05a;padding-left:8px;}

  .theme{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:10px 0;background:#fafbfc;transition:all .15s ease;}
  .theme:hover{box-shadow:var(--shadow-sm);border-color:#dde1e6;}
  .theme .th{font-weight:600;font-size:14px;margin-bottom:3px;}

Phone Ultra，未来几个月分阶段在各国（地区）上市；据华尔街见闻，产业链已将备货量上调至 1000 万台。发布节点明确（距今约 3 周）是本条最强的确定性来源，但备货量属产业链传闻口径。注意 8/20 该方向已炒过一轮（领益等），属二次交易。","stk":"核心稳健：蓝思科技/领益智造/鹏鼎控股｜弹性：联得装备/宇环数控/宜安科技/精研科技/统联精密/东睦股份"},{"h":"医药 · WCLC 摘要公布（9/12-9/15）","badge":"题材 · 兑现期3周后","body":"WCLC 官网公布部分摘要及 LBA / 主席讨论入选情况：含金量最高的主席讨论环节共 8 项，其中 2 项来自中国——翰森制药 B7H3 ADC HS20093、宜联生物 YL201（均为后线 SCLC 中国 III 期）；口头报告有 64 项中国研究入选。已披露摘要中：荣昌生物 PD1×VEGF 双抗 RC148 联化疗 1L NSCLC（n=121）nsq ORR 76%/sq ORR 90% 且无 3 级以上出血；石药 EGFR ADC SYS6010 整体 ORR 45%/DCR 79%；维立志博 PDL1×41BB 双抗整体 ORR 65%/DCR 95%；首药控股三代 ALK 经治 ORR 43%、颅内 ORR 65%、PFS 9.7m。方向上由 8/20 的 mRNA 切换至 ADC / 双抗分支。","stk":"翰森 / 宜联 / 荣昌生物 / 石药 / 维立志博 / 首药控股"},{"h":"存储链 · 三星股东回报","badge":"叙事延续 · 缺细节","body":"三星计划向股东返还高达 790 亿美元。该条延续 8/20 海力士 40 万亿韩元回购注销的「存储资本纪律重估」叙事线，但与海力士「已启动」不同，本条为**「计划」且未见金额拆分、时间表与出处细节**，可验证性明显偏弱。存储链本身仍处 8/19 崩塌后的分化修复中（8/20 存储芯片 -0.09%、主力净流出 54.4 亿）。","stk":"长鑫 / 兆易 / 德明利（8/19后仍在修复）"},{"h":"黄金 · 卖方转推右侧","badge":"叙事型 · 逻辑内部矛盾","body":"核心观点：财政部回购解决不了本金安全问题，本质是要求联储开动印刷机、短期压低利率以支撑财政支出；据此认为「别信联储独立」，9 月后进入降息交易。但同一篇中「金价 4800 之前都是左侧、破 4800 才进入自我驱动」与结论「股票开始进入右侧了」自相矛盾——8/20 金价刚破 4500，按其自身标准仍在左侧。金价破位是硬事实，但择时判断主观性强、不可证伪。","stk":"赤峰黄金/中金国际/万国/山金国际/灵宝/中金黄金｜白银：盛达资源/兴业银锡"},{"h":"周期与其他 · 煤炭 / 光伏 / 稀土","badge":"背景","body":"煤炭：晋陕蒙 100 家动力煤矿周产量 1172 万吨（同比 -2.0%、周环比 -0.1%），库存 306.1 万吨（同比 -4.7%），平均利润 394.3 元/吨（同比 +40.7%、周环比 +3.3%），开工率 86.0%——供给微收缩 + 利润改善，防御属性延续。光伏：多晶硅开始试探提价但成交有限，硅片继续上行、电池片国内主流约 0.35 元/W、玻璃开始涨价但组件企业多在观望；大全能源 H1 亏损扩大至 15.95 亿，涨价传导尚未到盈利端。另有中国对美稀土出口增长、英伟达计划年底前向中国交付 AI 芯片两条单句消息，均无细节。","stk":"煤炭防御｜光伏涨价链观望｜稀土（航空航天）"}]},{"type":"h3","body":"消息甄别：小作文 / 真推荐"},{"type":"verdict","head":["方向","评级","逻辑硬度","兑现度","甄别理由"],"rows":[["国产算力 · CSP Capex",{"v":"真推荐","cls":"ok"},"最硬","最高（财报已披露）","阿里 676.8 亿 / 腾讯 527.8 亿均为已公告财报数据，非预期外推；AI云收入 +45%、利润率 7.2%→11.6% 构成「量利齐升」交叉验证；6 篇独立卖方同向收敛。**今日确定性最高、优先配置。**"],["光模块 / 光通信",{"v":"真推荐(含hype)","cls":"ok"},"硬","高（激励为硬承诺）","新易盛激励考核以营收硬指标对外承诺（500/900/1500 亿），CoreWeave 千亿订单、亨通出货量指引均可验证；但「2029 年 2100 亿营收」是激励目标非在手订单，「大立光 FA 客户为博通」属市场传闻、公司明确不评论——含 hype，且方向 8/19 刚崩过，控仓。"],["模拟芯片",{"v":"真推荐","cls":"ok"},"最硬","最高（业绩已出）","思瑞浦 Q2 营收 +71.3%/归母 +303.7%、圣邦 Q2 归母 +97%~118% 均为已披露业绩；ADI 指引超预期 + 通信同比 +84% 提供海外交叉验证；BOM 价值量测算有产业依据。属「超预期才上」标准范式。"],["半导体设备与材料",{"v":"真推荐(需辨质量)","cls":"ok"},"硬","高（订单/合同负债可查）","拓荆合同负债 51.31 亿、存货 88.33 亿、员工增 353 人为可查硬指标，存储扩产大周期成立；**但归母 +220% 与扣非 +21.42% 严重背离，主要业绩弹性来自非经常性损益，卖方标题「收入高速增长」淡化了这一点**——需按扣非口径重估，不可照搬归母增速。"],["芯片电感 / TLVR",{"v":"真推荐(含hype)","cls":"ok"},"中高","中（出货可月度跟踪）","在手订单 7 亿→9 亿+、月度出货 1 亿→1.5 亿为可跟踪数据，MPS 切入 Google 带动份额提升有产业逻辑；但「NV Rubin Ultra 可能部分采用」「明年预计升 8 相」为预期外推，「27 年 440 亿市值、40% 空间」是卖方目标价，hype 成分明确。"],["苹果折叠屏",{"v":"真推荐(含hype)","cls":"ok"},"中高","中（发布日期临近）","9/9 发布节点具体、距今约 3 周，可验证性尚可；但「有望推出」仍属预期，「备货 1000 万台」为产业链传闻口径而非公司指引，且 8/20 已炒一轮，二次交易需防高开低走。"],["医药 · WCLC",{"v":"真推荐(题材)","cls":"ok"},"硬","中低（9/12 才召开）","摘要为大会官网已公布、入选名单可查，数据质量硬（RC148 ORR 76%/90% 等）；但多项重点研究摘要尚未披露、大会 9/12-15 才召开，属预期交易，兑现期在 3 周后，按题材控仓。"],["存储链 · 三星 790 亿回报",{"v":"观察(含小作文风险)","cls":"bad"},"弱","低（仅「计划」）","单句消息、无金额拆分/时间表/出处，与 8/20 海力士「已启动回购」的可验证性不可同日而语；仅可作存储资本纪律叙事的背景强化，**不作交易依据**。"],["黄金",{"v":"观察(含小作文风险)","cls":"bad"},"中","中（金价破位为实）","金价站上 4500 是硬事实，但推荐逻辑主体为宏观叙事（「别信联储独立」「联储和特朗普的嘴都是骗人的鬼」）——主观、不可证伪；且文内「4800 之前都是左侧」与结论「股票进入右侧」自相矛盾，按其自身标准当前仍在左侧。仅背景。"],["光伏涨价链",{"v":"观察","cls":"flat"},"中","低（下游观望）","多晶硅试探提价「成交有限」、玻璃涨价「组件企业仍在观望」，涨价未真正传导；大全能源 H1 亏损扩大至 15.95 亿，盈利端毫无兑现。属涨价预期而非涨价事实。"],["英伟达年底前对华交付",{"v":"观察·对冲风险","cls":"bad"},"弱（单句无细节）","低","路透社单句转述、无时间表与品类细节，本身不可交易；**但方向上是今日国产算力主线的直接对冲**——若后续落实，国产替代紧迫性下降，需据此下调国产算力仓位。列为主线的头号风险变量而非做多依据。"]]},{"type":"h3","body":"纳入参考（盘前→盘中跟踪）"},{"type":"list","items":["**国产算力链**（最硬、集中度最高）——超节点华勤、交换机紫光/锐捷、交换芯片盛科、连接器华丰/胜蓝，盯能否放量凝聚为主线龙头","**模拟芯片**（业绩已出）——思瑞浦、圣邦，看资金是否认可「超预期才上」","**半导体设备/材料**（存储扩产）——拓荆（按扣非口径看，勿照搬归母 +220%）、上海新阳","**光模块**（激励硬承诺）——新易盛，兼看 8/19 崩后的修复力度与 1.6T 节奏","**芯片电感/TLVR**（月度出货可跟踪）——铂科新材，8 月出货能否达 1.5 亿是验证点","**苹果折叠屏**（9/9 节点）——蓝思/领益，注意已属二次交易","**医药 WCLC**（9/12-15）——翰森/宜联/荣昌，题材控仓、兑现期偏后","**煤炭**（供给收缩+利润改善）——防御仓位备选"]},{"type":"warn","body":"**风险与谨慎池**：\n① **英伟达计划年底前向中国交付 AI 芯片（路透）——今日最大对冲变量**。国产算力主线的核心叙事之一是替代紧迫性，该消息若落实将直接削弱逻辑，务必盯后续证实/证伪，不可无视。\n② **拓荆归母 +220% vs 扣非 +21.42%**——利润质量背离，卖方标题淡化，须按扣非重估，防「看着超预期实际不达标」。\n③ **黄金、三星 790 亿回报**——叙事型推荐，前者逻辑内部矛盾、后者仅为「计划」缺细节，仅作背景。\n④ **光伏涨价**——下游观望、盈利端未兑现，勿把涨价预期当涨价事实。\n⑤ **结构性风险**：8/20 仅为弱修复（指数微红、量能 2.08 万亿未放大），8/19 崩塌后高位 AI 硬件链仍在分化，光模块 / 存储属崩过一轮的高位方向，**即便主线逻辑变硬也需控仓、勿在量能未回 2.3 万亿前重仓追高**。\n⑥ 本工作台为个人复盘记录，所有结论基于公开行情与卖方研究观点整合，不构成投资建议。"}]},"panzhong":{"marketOverview":{"ts":"2026-08-21 11:30 盘中快照（半日）","indices":[{"n":"上证指数","v":"+0.04%","cls":"up","amt":"5850亿"},{"n":"深证成指","v":"+0.66%","cls":"up","amt":"6609亿"},{"n":"沪深300","v":"+0.58%","cls":"up","amt":"3209亿"},{"n":"创业板指","v":"+1.29%","cls":"up","amt":"3293亿"},{"n":"科创综指","v":"+0.01%","cls":"flat","amt":"1987亿"},{"n":"北证50","v":"-0.34%","cls":"down","amt":"89亿"},{"n":"中证全指","v":"+0.14%","cls":"up","amt":"1.21万亿"}],"breadth":{"zt":"—","dt":"—","up":"—","down":"—","amt":"约1.21万亿（半日·中证全指全A口径）","note":"涨跌家数/涨跌停以收盘后盘后模块为准（盘中广度接口返回前一交易日：8/20 涨停 84 / 跌停 13，与盘前引用的「约94/约10」略有口径差异，后续统一以核验值为准）"},"mainLines":[{"h":"结构：成长与深市占优，沪市与科创双双落后","body":"创业板指 +1.29%、深证成指 +0.66% 明显强于上证 +0.04%、科创综指 +0.01%。**同为「科技」，资金只买弹性分支**——科创板集中的半导体设备/材料/模拟芯片半日几乎零反应，而创业板承载的光模块、铁锂、陶瓷基板成为主战场。沪深300 +0.58% 强于上证，说明沪市内部是权重稳、非权重弱的分化格局。","cls":"up"},{"h":"量能：半日 1.21 万亿，略快于 8/20 节奏但未确认放大","body":"8/20 全天两市 2.08 万亿，今日半日全A成交 1.21 万亿，线性外推全天约 2.2–2.4 万亿，**方向上是温和放量**。但盘前设定的「量能重回 2.3 万亿上方」是弱修复转反转的门槛，午后能否维持是关键，半日数据尚不足以确认。","cls":"up"},{"h":"最重要的盘中信号：逻辑最硬的方向没涨，新叙事在涨","body":"盘前判定为「唯一由硬财报驱动、确定性最高」的国产算力链，半日实测紫光股份 +1.21%、华勤技术A 持平（H股 +3.31%）、思瑞浦 +0.36%——**几乎全部平淡**。反而是盘前列为「含hype·控仓」的光模块（新易盛 +5.43%）、以及盘前未覆盖的氮化铝陶瓷基板（国瓷材料 +7.25%）、碳酸锂铁锂（湖南裕能 +5.23%）领涨。资金对「已披露业绩」呈现利好出尽特征，偏好 0→1 叙事与涨价弹性。","cls":"down"}]},"blocks":[{"type":"text","body":"**与盘前预判的对照（半日结论前置）**：\n\n盘前的核心判断是——冰点已过、修复行情有望由「广度普涨」升级为「主线聚焦」，主线是国产算力（阿里 Capex 676.8 亿 + 腾讯 527.8 亿硬数据驱动），仓位建议 4 成以下、量能未回 2.3 万亿不重仓追高。\n\n半日实测结果是 **对了一半、错了一半**：\n① **对的部分**——指数未再破位，量能温和放量（半日 1.21 万亿快于 8/20 节奏），冰点已过的判断成立；「不重仓追高」的纪律事后看是正确的。\n② **错的部分**——「主线聚焦于国产算力」未被资金兑现。逻辑硬度与兑现度最高的两条（国产算力、模拟芯片）半日几乎零涨幅；而盘前明确标注「含hype、8/19 刚崩过、控仓」的光模块反而涨幅最大。\n\n**方法论层面的当日教训**：逻辑硬度 ≠ 当日资金选择。财报已披露的「硬数据」在盘中更接近利好出尽，资金真实偏好是 **0→1 的新叙事（氮化铝/陶瓷基板）+ 价格弹性（碳酸锂）+ 崩后超跌修复（光模块）**。盘前的甄别框架（真推荐 vs 小作文）解决的是「会不会被证伪」，不解决「今天涨不涨」，两者需分开使用。"},{"type":"kpi","items":[{"l":"半日全A成交","v":"1.21万亿","cls":"up"},{"l":"创业板指 vs 上证","v":"+1.29% vs +0.04%","cls":"up"},{"l":"最强盘中方向","v":"氮化铝/陶瓷基板 国瓷+7.25%","cls":"up"},{"l":"盘前主线兑现度","v":"紫光+1.21% / 思瑞浦+0.36%","cls":"down"},{"l":"盘前控仓方向反成最强","v":"新易盛 +5.43%","cls":"up"}]},{"type":"h3","body":"当日核心主题（按盘中强度排序）"},{"type":"themes","items":[{"h":"氮化铝 / 陶瓷基板 · Rubin 0→1 + 重稀土管制","badge":"盘中最强 · 新增主题 · 叙事型","body":"**盘前完全未覆盖的方向，半日成为最强分支。** 核心逻辑：Rubin 量产之际最受益的陶瓷基板细分是氮化铝产业链，上游粉体需添加约 5% 氧化钇，而海关数据显示 **7 月对日氧化钇出口继续为 0**——重稀土管制叠加 Rubin 需求 0→1，氮化铝陶瓷产业链有望重塑。\n上游材料环节两条延伸：① 族兴新材（920078）是国内唯一实现 4N 级（99.99%）高纯微细球形铝粉规模化量产的企业，普通铝粉杂质高、球形度差无法制造高端氮化铝，公司已与宁夏时星等氮化铝粉体/基板企业稳定供货、订单已落地；② 新疆众和是国内唯一规模生产超高纯铝基溅射靶材坯料、也是唯一实现 6N 级靶坯量产的企业（打破日本 JX 金属、住友电工垄断），高纯铝产能 7.8 万吨/年（全球占比约 20%）、电子铝箔约 3 万吨/年（国内市占超 30%）、电极箔约 2500 万㎡/年，是 MLPC 叠层固态铝电解电容必用基材、AI 服务器 GPU 供电 VRM 模块标配。\n**甄别提示**：氧化钇出口为 0 是可查硬数据，但「Rubin 陶瓷基板用量」「氮化铝渗透率」均无公司或客户端公开指引，属典型 0→1 预期交易，弹性来自稀缺性而非当期业绩。","stk":"国瓷材料（+7.25%）｜旭光电子 / 金博股份｜上游材料：族兴新材(920078) / 新疆众和"},{"h":"光模块 · 8/19 崩后最强修复","badge":"盘中次强 · 盘前列为控仓","body":"新易盛半日 +5.43%，是盘前所列方向中涨幅最大的一条，**修复力度显著强于盘前预期**。支撑仍是 8/20 的限制性股票激励草案：授予价 212 元、考核 2026/2027/2028 营收不低于 500/900/1500 亿元，以营收硬指标形式对外承诺；公司称 Q3/Q4 及明年订单能见度清晰、800G 已成主力出货、1.6T 放量加速。今日盘前另有大立光 CPO 布局加速（光纤阵列 FA 已 7 月完成客户送样、首条自动化试产线 Q3 底建置完成）延续。\n**注意**：盘前将该方向定性为「真推荐(含hype)·控仓」，理由是 8/19 刚崩过属高位方向。半日走强说明超跌修复动能被低估，但这不改变其高位属性——**是修复不是新高逻辑，追高性价比随涨幅递减**。","stk":"新易盛（+5.43%）/ 中际旭创 / 天孚通信 / 源杰 / 光迅科技"},{"h":"碳酸锂 / 铁锂 · 传言驱动突破 15.5 万","badge":"盘中强 · 驱动主体为传言","body":"碳酸锂今日受传言影响突破 15.5 万元压力位，叠加供给紧张与需求旺季，铁锂 Q3 盈利有望创新高，对应当年估值不到 10x。\n配套流传的产业链口径（均标注为「传」）：① 某新增供给项目预计投产较慢、9 月比较难出来（来源为空头）；② 电芯客供减量，逼正极厂补库；③ **9 月正极排产预期 8–10%，8 月为 6%（此前预计 5%，已上调）**。\n**甄别提示**：本条驱动主体明确是传言而非公告或价格公示，价格突破本身是硬事实但触发因素不可验证。三条产业链信息中，**唯一可跟踪、可事后验证的硬线索是 9 月正极排产上调（5%→8–10%）**，其余两条为单向口述。按小作文驱动处理：可参与但需以排产数据兑现为持有条件。","stk":"湖南裕能（+5.23%）/ 万润新能 / 龙蟠科技 / 富临精工"},{"h":"液冷 · 代工链 T2 Q3 放量（卖方强推，股价未响应）","badge":"预期未验证 · 分歧","body":"两条独立卖方同向推荐，但**盘中股价完全未反应（金帝股份 -0.18%）**，是今日最明显的「逻辑与资金背离」。\n① 金帝股份：冷锻 + 冲压级进模替代传统 CNC 机加工，生产效率与材料利用率提升 30% 以上、成本降幅达 40%，实现液冷单品至总成一体化供货；收购宸裕布局 MIM 工艺，从结构根源解决液冷焊缝漏液痛点；客户端已深度进入英伟达供应链（泽鸿、讯强），同时覆盖华为、中兴、浪潮等国内算力大厂；液冷业务 26/27/28 年收入预计 1/10/20 亿元、净利润 0.15/1.5/3 亿元。\n② 金富科技 & 五洋自控（液冷波纹管双雄）：今日为三地路演推荐完结日，卖方称液冷下游 Q3 放量势不可挡、代工链（T2）最先释放业绩，「逻辑最好、最快放业绩、最确定性」，强 call。\n**甄别提示**：卖方措辞为「强call」「一致预期越来越强」，属情绪性表述而非可验证指标；金帝液冷 26 年收入仅 1 亿元，业绩弹性绝大部分落在 27/28 年，**当期兑现度低**。资金半日不认，需等 Q3 订单或收入数据实证。","stk":"金帝股份（-0.18%）/ 金富科技 / 五洋自控"},{"h":"半导体零部件 / 电子材料 · 国产化加速（逻辑可跟踪，股价平淡）","badge":"硬逻辑 · 未获资金兑现","body":"正帆科技（+0.45%）：① 零部件大趋势——中微最新指引下半年交付压力加大、加速零部件国产化，公司是中微 gasbox 核心供应商；华创因零部件紧缺导致交付 delay，AMAT 指引 2028 年前产能翻倍，海外保供自身已紧张，国产零部件成长空间打开。② 热石英被低估——石英件为核心耗材、国内市场超百亿，热石英（扩散氧化用）用量大、价值量高、壁垒高于冷处理石英；子公司汉京主要客户包括东电、KE、台积电等海外龙头，本土设备龙头及华虹等均已进入，**毛利率 50%–60%**，2024–2025 逆周期大幅扩产，预计实现全球最大热石英新建产能（约 30 亿），日本信越等积极寻求代工。③ 兑现历史——2016–2024 年收入 CAGR 30%、利润 CAGR 超 50%，今年已完全消化过去低毛利订单，新接订单毛利率恢复常态。\n翰博高新：8/20 东进世美肯（上海）新材料有限公司正式成立运营。东进世美肯深耕半导体湿电子化学品近六十年，三星、LG、SK 海力士及国内主流晶圆/面板厂均为长期客户；承接高纯试剂、显影液、刻蚀液、剥离液、清洗液、光刻胶及 OLED/LCD 功能材料，规划延伸至 CMP 研磨液、有机绝缘膜、光刻胶配套。9 大工厂收购落地：启东产能有翻倍空间（服务上海/无锡）、北京服务亦庄 fab、合肥本部服务长鑫、成都/重庆辐射华虹。风险提示：新增产能消化、显示技术迭代、收购进展不及预期。\n**判断**：属逻辑硬度高但兑现节奏偏慢的方向，科创综指半日 +0.01% 也印证该板块整体缺乏资金，**适合跟踪不适合追买**。","stk":"正帆科技（+0.45%）/ 翰博高新"},{"h":"券商 · 中信证券 26H 业绩高增（今日新增硬数据）","badge":"业绩已出 · 硬","body":"2026H 营业收入 496.9 亿、归属净利润 233.4 亿，同比分别 **+50.0% / +69.6%**，加权 ROE 同比 +2.88pct 至 7.81%。分条线同比：自营 +40.7%（273.9 亿）、经纪 +53.9%、投行 +44.1%（30.2 亿）、资管 +31.9%（71.8 亿）、利息 +687.7%，自营与经纪贡献主要业绩支撑。\n财富管理：境内客户累计超 1800 万户（较年末 +7%），托管客户资产规模较年末 +14%；资管规模 19753 亿（较年初 +12.1%），华夏基金净利润 14.1 亿（+25.8%）。投行：A 股主承销市场份额 30.56%、承销规模市场第一；债券承销占全市场 7.22%、占证券公司总规模 13.92%，份额行业第一。自营：交易性金融资产较年初 +12.1% 至 8714.50 亿，衍生金融资产较年初 +72.2% 至 681.85 亿。市场环境：26H 万得全A +11.5%（去年同期 +5.8%）、中债总全价 +0.6%（去年同期 -0.7%），股债双强。当前股价对应 2026 年 PB 1.33x。\n**甄别提示**：主体为已披露中报硬数据，可信度高；但文内经纪业务同比出现两个口径（+53.9% 与 +31.2% 至 98.6 亿）互相矛盾，**以正式财报口径为准，勿直接引用增速**。","stk":"中信证券｜券商板块（大金融修复备选）"},{"h":"苹果折叠 / OLED 设备 · 联得装备更新","badge":"延续盘前 · 节点临近","body":"周期拐点确认，预计至少三年主业上行周期，苹果占比提升驱动盈利能力上升：① 今年全球显示行业资本开支同比 +57%、OLED +74%，大尺寸 OLED 加速导入；② 京东方×苹果 IT OLED 项目，B16 二期翻倍扩产，苹果 OLED 计划覆盖其所有设备；③ **苹果一代折叠采用多层贴膜方案、二代折叠采用液态胶体，需做整线更新，价值量大幅提升**。\n新领域 0→1 突破：光芯片键合设备完成鸿海体系业成验收导入、共研光芯片板级封装固晶贴片机，有望实现 ASMPT 替代，并向旭创提供点胶设备；深度参与京东方/沃格玻璃基设备开发（涂布/贴合/键合/切割/减薄，整线可参与价值量 50%）；高温键合设备达国内顶尖水平，已在通富实现对日本设备替代。\n**提示**：与盘前一致，苹果折叠方向 8/20 已炒一轮，属二次交易；本条的增量在于「二代折叠需整线更新」把逻辑从单机延伸到设备替换周期，以及光芯片/玻璃基两条 0→1 分支。","stk":"联得装备｜蓝思科技 / 领益智造 / 鹏鼎控股（盘前池）"},{"h":"电新出口链 · 7 月数据（背景，结构分化）","badge":"背景 · 数据可查","body":"**电力设备（强）**：液体变压器 7 月出口 49.75 亿元（同比 +29.97%、环比 +10.83%），1–7 月 290.82 亿（+30.44%），400MVA 以上同比增长 50% 以上，拉美环比 +32.53%、非洲 +72.61%、北美 +67.49%、欧洲 +66.82%；高压柜 33.00 亿（+71.08%、环比 +15.78%），**北美同比 +230.45%、欧洲 +165.29%**；低压开关 127.36 亿（+28.09%）；电缆 21.84 亿（+13.74% 但环比 -17.75%）；电表 9.24 亿（+9.14%、环比 -7.86%）。\n**逆变器（稳）**：7 月出口 10.89 亿美元（同比 +19.47%、环比 -11.47%），1–7 月 66.23 亿美元（+28.15%）。亚洲 +37.24%（菲律宾 +314%、泰国 +121%、沙特 +64%）、欧洲 +11.64%（淡季仍同环比双增）、非洲 +76.19%；**澳洲抢装退坡明显（澳大利亚同比 -5%、环比 -49%）**，美国 -21%、巴西 -43%。\n**电池组件（弱）**：7 月组件出口 16.36GW（同比 -15.20%、环比 -13.75%）、电池 5.42GW（-56.34%）；1–7 月组件累计 136.18GW（-3.47%）、电池累计 65.31GW（+21.19%）。印度对光伏电池进口限制政策延期到年底，预计后续电池进口环比增长。\n**判断**：电力设备出口（变压器/高压柜）是三条中唯一同环比双强、且区域全面开花的分支，可作为盘前煤炭之外的第二个防御/稳健备选；组件电池延续下行，与盘前「光伏涨价未传导至盈利端」的结论一致。","stk":"电力设备出口（变压器 / 高压柜 / 低压开关）｜逆变器（亚非欧）｜光伏组件电池：回避"},{"h":"消费 · 泡泡玛特 1H26：短期承压、结构改善","badge":"背景 · 长逻辑","body":"业绩交流核心：短期业绩压力大，但结构更健康。**拉布布营收占比由去年 38% 降至本季 25%，星星人升至 15%**，从单一 IP 依赖走向 IP 平台化——管理层明确表示若追求短期业绩本应加大拉布布曝光（占比会过半），而选择主动牺牲部分短期业绩换组织升级。\n管理层原话要点：2025 年数字虽好但是「一美遮百丑」的一年，顾客长期处于申请/抢购/排队状态并非应有常态；供应链、门店运营、人员管理多地区均有问题，2026 年着手逐项解决。海外侧：美欧旗舰店/大店供应链难度大、费用预算与实际落地有差距，最近西方市场新开门店的工程质量与费用控制已改善；物流核心问题是产品开发留给生产物流的时间不足，导致海运量少、依赖空运，出现新品不能同期发售或一上市断货，欧洲已重新盘点门店（部分重谈条款、部分放弃）；仓储物流正做团队升级并布局新网点。\n**判断**：属「短空长多」型信息，本季数字不支持短期交易，但 IP 集中度下降是可量化的结构改善证据。另今日同步流出昆仑万维、网易、阿里巴巴 1H26/2Q26 业绩会纪要，港股与传媒方向信息密度上升。","stk":"泡泡玛特（H /* ---------- 渲染引擎 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');}
function cell(c){
  if(c==null) return '<td></td>';
  if(typeof c==='object'){ const cls=c.cls?(' class="'+c.cls+'"'):''; return '<td'+cls+'>'+md(c.v)+'</td>'; }
  return '<td>'+md(c)+'</td>';
}
function renderBlock(b){
  switch(b.type){
    case 'tags': return '<div class="tags">'+b.items.map(t=>'<span class="pill">'+esc(t)+'</span>').join('')+'</div>';
    case 'kpi': return '<div class="grid">'+b.items.map(k=>'<div class="kv"><div class="l">'+esc(k.l)+'</div><div class="v '+(k.cls||'')+'">'+md(k.v)+'</div></div>').join('')+'</div>';
    case 'text': return '<p class="'+(b.cls||'')+'">'+md(b.body)+'</p>';
    case 'note': return '<div class="note">'+md(b.body)+'</div>';
    case 'warn': return '<div class="warnbox">'+md(b.body)+'</div>';
    case 'h3': return '<h3>'+md(b.body)+'</h3>';
    case 'list': return '<ul>'+b.items.map(i=>'<li>'+md(i)+'</li>').join('')+'</ul>';
    case 'table': {
      let h='<table><thead><tr>'+b.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
      h+=b.rows.map(r=>'<tr>'+r.map(cell).join('')+'</tr>').join('');
      h+='</tbody></table>';
      if(b.note) h+='<p class="muted">'+md(b.note)+'</p>';
      return h;
    }
    case 'themes': return b.items.map(t=>{
      let h='<div class="theme"><div class="th">'+md(t.h);
      if(t.badge) h+='<span class="badge">'+esc(t.badge)+'</span>';
      h+='</div><div class="tb">'+md(t.body)+'</div>';
      if(t.stk) h+='<div class="stk">'+md(t.stk)+'</div>';
      return h+'</div>';
    }).join('');
    case 'verdict': {
      let h='<table class="verdict"><thead><tr>'+b.head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
      h+=b.rows.map(r=>'<tr>'+r.map(c=>{
        if(c==null) return '<td></td>';
        if(typeof c==='object') return '<td class="'+(c.cls||'')+'">'+md(c.v)+'</td>';
        return '<td>'+md(c)+'</td>';
      }).join('')+'</tr>').join('');
      return h+'</tbody></table>';
    }
  }
  return '';
}

/* 黄金跟踪：位置与操作 */
function goldSpark(s){
  if(!s || !s.g || s.g.length<2) return '';
  const W=300,H=72,pad=5;
  const vals=s.g, n=vals.length;
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  const xs=i=> pad + i*(W-2*pad)/(n-1);
  const ys=v=> pad + (H-2*pad)*(1-(v-mn)/((mx-mn)||1));
  let line=vals.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  let area=line+' L'+xs(n-1).toFixed(1)+' '+(H-pad)+' L'+xs(0).toFixed(1)+' '+(H-pad)+' Z';
  return '<svg class="gspark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" width="100%" height="'+H+'">'
    +'<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87a00" stop-opacity="0.30"/><stop offset="1" stop-color="#a87a00" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#gg)"/>'
    +'<path d="'+line+'" fill="none" stroke="#a87a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+xs(n-1).toFixed(1)+'" cy="'+ys(vals[n-1]).toFixed(1)+'" r="3.2" fill="#a87a00"/>'
    +'</svg>'
    +'<div class="gspark-meta"><span>'+esc(s.x[0])+' '+mn.toFixed(0)+'</span><span>近月日收盘 · 现货黄金(美元/oz)</span><span>'+esc(s.x[n-1])+' '+mx.toFixed(0)+'</span></div>';
}
/* 黄金跟踪：完整曲线图（金 + 银双线 + MA5 + 网格/坐标/当前价标注） */
function goldChart(c){
  if(!c || !c.series) return '';
  const x=c.x||[], gold=c.series.gold||[], silver=c.series.silver||[];
  if(gold.length<2) return '';
  const W=620, H=178, pad={l:40,r:16,t:14,b:24};
  const all=gold.concat(silver).filter(v=>v!=null);
  const mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  const padR=(mx-mn)*0.10||1;
  const ymn=mn-padR, ymx=mx+padR;
  const xs=i=>pad.l + i*(W-pad.l-pad.r)/(x.length-1);
  const ys=v=>pad.t + (H-pad.t-pad.b)*(1-(v-ymn)/((ymx-ymn)||1));
  const lineOf=(arr)=>arr.map((v,i)=>(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)).join(' ');
  /* MA */
  const ma=(arr,n)=>arr.map((_,i)=>{
    if(i<n-1) return null;
    let s=0,c=0;
    for(let k=i-n+1;k<=i;k++){ if(arr[k]!=null){ s+=arr[k]; c++; } }
    return c?s/c:null;
  });
  const ma5=ma(gold,5);
  /* 网格 + Y 轴刻度（4 条） */
  let grid='';
  for(let i=0;i<=4;i++){
    const yv=ymn+(ymx-ymn)*i/4;
    const y=ys(yv);
    grid+='<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+'" stroke="#f1e6c4" stroke-width="0.6"/>';
    grid+='<text x="3" y="'+(y+3.5).toFixed(1)+'" font-size="10" fill="#8a6d1f">'+yv.toFixed(0)+'</text>';
  }
  /* X 轴标签（首/中/末） */
  const xt=[0,Math.floor(x.length/2),x.length-1];
  let xlabels='';
  xt.forEach(i=>{
    const tx=x[i]||'';
    xlabels+='<text x="'+xs(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="#8a6d1f" text-anchor="middle">'+esc(tx.slice(5))+'</text>';
  });
  /* 当前价标注 */
  const lastG=gold[gold.length-1], lastS=silver.length?silver[silver.length-1]:null;
  let dots='';
  if(lastG!=null){
    dots+='<circle cx="'+xs(gold.length-1).toFixed(1)+'" cy="'+ys(lastG).toFixed(1)+'" r="3.6" fill="#a87a00"/>';
    dots+='<text x="'+(xs(gold.length-1)-6).toFixed(1)+'" y="'+(ys(lastG)-7).toFixed(1)+'" font-size="11" fill="#a87a00" font-weight="700" text-anchor="end">'+lastG.toFixed(1)+'</text>';
  }
  if(lastS!=null){
    dots+='<circle cx="'+xs(silver.length-1).toFixed(1)+'" cy="'+ys(lastS).toFixed(1)+'" r="3.2" fill="#6b6b6b"/>';
    dots+='<text x="'+(xs(silver.length-1)-6).toFixed(1)+'" y="'+(ys(lastS)+14).toFixed(1)+'" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="end">'+lastS.toFixed(2)+'</text>';
  }
  /* 金 area */
  const gArea=lineOf(gold)+' L'+xs(gold.length-1).toFixed(1)+' '+(H-pad.b)+' L'+xs(0).toFixed(1)+' '+(H-pad.b)+' Z';
  /* 银 line（仅当 silver 有数据） */
  const sLine=silver.length?lineOf(silver):'';
  /* MA5 line（用插值点补齐 null，开头沿用真实首点） */
  const ma5path=ma5.map((v,i)=>v==null?null:((i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1))).filter(Boolean).join(' ');

  let html='<div class="gold-chart-wrap">';
  html+='<div class="gc-head">'
    +'<span class="gc-l">近月日收盘走势</span>'
    +'<span class="gc-r"><span class="lc gc-gold"></span>黄金 <span class="lc gc-silver"></span>白银 <span class="lc gc-ma"></span>MA5</span>'
    +'</div>';
  html+='<svg class="gold-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" width="100%" height="'+H+'">';
  html+='<defs><linearGradient id="gcg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a87a00" stop-opacity="0.18"/><stop offset="1" stop-color="#a87a00" stop-opacity="0"/></linearGradient></defs>';
  html+=grid;
  html+='<path d="'+gArea+'" fill="url(#gcg2)"/>';
  html+='<path d="'+lineOf(gold)+'" fill="none" stroke="#a87a00" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/>';
  if(sLine) html+='<path d="'+sLine+'" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="3,2" stroke-linejoin="round"/>';
  if(ma5path) html+='<path d="'+ma5path+'" fill="none" stroke="#d4a017" stroke-width="1.4" stroke-dasharray="5,3"/>';
  html+=dots+xlabels;
  html+='</svg>';
  html+='<div class="gc-meta"><span>'+esc(x[0])+' '+gold[0].toFixed(1)+'</span><span>区间 '+ymn.toFixed(0)+'-'+ymx.toFixed(0)+' '+(c.unit||'美元/oz')+'</span><span>'+esc(x[x.length-1])+' '+(lastG!=null?lastG.toFixed(1):'')+'</span></div>';
  html+='</div>';
  return html;
}
function renderGoldAnomalies(arr){
  if(!arr||!arr.length) return '';
  let h='<div class="gold-anomalies"><div class="ga-h">异动情况</div>';
  h+=arr.map(t=>{
    let x='<div class="theme"><div class="th">'+md(t.h);
    if(t.badge) x+='<span class="badge">'+esc(t.badge)+'</span>';
    x+='</div><div class="tb">'+md(t.body)+'</div>';
    if(t.stk) x+='<div class="stk">'+md(t.stk)+'</div>';
    return x+'</div>';
  }).join('');
  return h+'</div>';
}
function renderGold(g){
  let h='<div class="goldmod">';
  h+='<div class="ch gold">黄金跟踪 · 位置与操作</div>';
  if(g.ts) h+='<div class="ts">'+esc(g.ts)+'</div>';
  h+='<div class="gold-grid">';
  h+='<div class="gold-col"><div class="gl">COMEX黄金</div><div class="gv">'+md(g.price.comex)+'</div><div class="gs">美元/oz</div></div>';
  h+='<div class="gold-col"><div class="gl">现货黄金</div><div class="gv">'+md(g.price.spot)+'</div><div class="gs">美元/oz</div></div>';
  h+='<div class="gold-col"><div class="gl">国内Au9999</div><div class="gv">'+md(g.price.cn)+'</div><div class="gs">'+esc(g.price.cnUnit||'元/克')+'</div></div>';
  h+='</div>';
  if(g.chart) h+=goldChart(g.chart);
  else if(g.series) h+=goldSpark(g.series);
  if(g.anomalies && g.anomalies.length) h+=renderGoldAnomalies(g.anomalies);
  if(g.price && g.price.silver){ h+='<div class="silver-row"><div class="sr-h">白银指标</div>';
    h+='<span class="sr-item">现货白银 <b>'+md(g.price.silver.spot)+'</b></span>';
    h+='<span class="sr-item">COMEX白银 <b>'+md(g.price.silver.comex)+'</b></span>';
    h+='<span class="sr-item">国内Ag <b>'+md(g.price.silver.cn)+'</b> '+esc(g.price.silver.cnUnit||'元/克')+'</span>';
    h+='</div>'; }
  if(g.ratio){ h+='<div class="ratio-badge"><span class="rb-h">金银比</span><span class="rb-v">'+md(g.ratio.v)+'</span>'
    + (g.ratio.note?'<div class="rb-note">'+md(g.ratio.note)+'</div>':'') + '</div>'; }
  h+='<div class="gold-pos"><span class="gp-level">位置 · '+md(g.position.level)+'</span><p>'+md(g.position.text)+'</p></div>';
  if(g.drivers && g.drivers.length){ h+='<h3>核心驱动</h3><ul>'+g.drivers.map(d=>'<li>'+md(d)+'</li>').join('')+'</ul>'; }
  if(g.levels){ h+='<div class="gold-levels"><div class="gl-box"><div class="gl-l">关键支撑</div><div class="gl-v">'+md(g.levels.support)+'</div></div><div class="gl-box"><div class="gl-l">上方阻力</div><div class="gl-v">'+md(g.levels.resist)+'</div></div><div class="gl-box"><div class="gl-l">多空分水岭</div><div class="gl-v">'+md(g.levels.divide)+'</div></div></div>'; }
  h+='<div class="gold-op"><span class="go-level">操作 · '+md(g.op.level)+'</span><p>'+md(g.op.text)+'</p></div>';
  if(g.risks && g.risks.length){ h+='<div class="warnbox"><b>本周风险日历</b><ul style="margin:5px 0 0;padding-left:18px;">'+g.risks.map(r=>'<li>'+md(r)+'</li>').join('')+'</ul></div>'; }
  if(g.note) h+='<div class="note">'+md(g.note)+'</div>';
  return h+'</div>';
}
/* 盘前：市场概况（港股 + A股 + 大宗商品） */
function renderPanorama(p){
  const sec=(title,arr)=>{
    if(!arr||!arr.length) return '';
    let t='<div class="pano-col"><div class="pano-h">'+esc(title)+'</div><table>';
    t+=arr.map(x=>'<tr><td class="pn">'+esc(x.n)+'</td><td class="'+(x.cls||'flat')+'">'+md(x.v)+(x.sub?'<div class="sub">'+esc(x.sub)+'</div>':'')+'</td></tr>').join('');
    return t+'</table></div>';
  };
  // 兼容旧数据：p.us 缺失时兜底使用 p.hk；若两者都存在优先展示 p.hk + p.us(隔夜美股) -> 仅用 p.hk
  let h='<div class="pano"><div class="ch qian">市场概况 · 港股 + A股 + 大宗商品</div>';
  if(p.ts) h+='<div class="ts">'+esc(p.ts)+'</div>';
  h+='<div class="pano-grid">'+sec('港股（盘中/收盘）',p.hk||p.us)+sec('A股（上一交易日）',p.a)+sec('大宗商品',p.commod)+'</div>';
  if(p.note) h+='<div class="note">'+md(p.note)+'</div>';
  return h+'</div>';
}
/* 盘中/盘后：市场概况 */
function renderMarketOverview(mo){
  let h='<div class="mo"><div class="ch hou">市场概况（行情核验）</div>';
  h+='<div class="ts">'+esc(mo.ts||'')+'</div>';
  h+='<table><thead><tr><th>指数</th><th>涨跌幅</th><th>成交额</th></tr></thead><tbody>';
  h+=mo.indices.map(x=>'<tr><td>'+esc(x.n)+'</td><td class="'+(x.cls||'')+'">'+md(x.v)+'</td><td class="flat">'+esc(x.amt||'')+'</td></tr>').join('');
  h+='</tbody></table>';
  if(mo.breadth){
    const b=mo.breadth;
    h+='<div class="grid">';
    h+='<div class="kv"><div class="l">涨停</div><div class="v '+(b.zt&&b.zt!=='—'?'up':'flat')+'">'+esc(b.zt)+'</div></div>';
    h+='<div class="kv"><div class="l">跌停</div><div class="v '+(b.dt&&b.dt!=='—'?'down':'flat')+'">'+esc(b.dt)+'</div></div>';
    h+='<div class="kv"><div class="l">上涨/下跌</div><div class="v flat">'+esc(b.up)+'/'+esc(b.down)+'</div></div>';
    h+='<div class="kv"><div class="l">两市成交</div><div class="v flat">'+esc(b.amt)+'</div></div>';
    h+='</div>';
    if(b.note) h+='<p class="muted">'+md(b.note)+'</p>';
  }
  if(mo.mainLines && mo.mainLines.length){
    h+='<div class="molines">';
    h+=mo.mainLines.map(l=>'<div class="moline '+(l.cls||'flat')+'"><span class="mh">'+esc(l.h)+'</span> · '+md(l.body)+'</div>').join('');
    h+='</div>';
  }
  return h+'</div>';
}
/* 盘前：隔夜美股与重大事件（综合板块：4张大数字卡 + 表格 + 重大事件列表） */
function renderOvernight(o){
  if(!o) return '';
  let h='<div class="overnight"><div class="ch qian">隔夜美股与重大事件</div>';
  if(o.ts) h+='<div class="ts">'+esc(o.ts)+'</div>';
  /* 顶部：4张大数字卡 */
  if(o.indices && o.indices.length){
    h+='<div class="overnight-cards">';
    o.indices.forEach(idx=>{
      h+='<div class="overnight-card '+(idx.cls||'flat')+'">';
      h+='<div class="oc-n">'+esc(idx.n)+'</div>';
      h+='<div class="oc-v">'+md(idx.v)+'</div>';
      const meta=[idx.level, idx.note].filter(Boolean).join(' · ');
      if(meta) h+='<div class="oc-meta">'+esc(meta)+'</div>';
      h+='</div>';
    });
    h+='</div>';
    /* 表格 */
    h+='<table><thead><tr><th>指数</th><th>涨跌幅</th><th>收盘 / 简评</th></tr></thead><tbody>';
    o.indices.forEach(idx=>{
      const right=(idx.note?esc(idx.note):'—')+(idx.level?' · '+esc(idx.level):'');
      h+='<tr><td>'+esc(idx.n)+'</td><td class="'+(idx.cls||'flat')+'">'+md(idx.v)+'</td><td class="flat"><span class="muted">'+right+'</span></td></tr>';
    });
    h+='</tbody></table>';
  }
  /* 重大事件列表 */
  if(o.items && o.items.length){
    h+='<h3 class="overnight-events-h">【隔夜重大事件】</h3>';
    h+=o.items.map(t=>{
      let x='<div class="theme"><div class="th">'+md(t.h);
      if(t.badge) x+='<span class="badge">'+esc(t.badge)+'</span>';
      x+='</div><div class="tb">'+md(t.body)+'</div>';
      if(t.stk) x+='<div class="stk">'+md(t.stk)+'</div>';
      return x+'</div>';
    }).join('');
  }
  if(o.note) h+='<div class="note">'+md(o.note)+'</div>';
  return h+'</div>';
}
/* 盘前：旧版 events 列表（向后兼容，仅在无 overnight 时启用） */
function renderEvents(list){
  if(!list||!list.length) return '';
  let h='<div class="events"><div class="ch qian">隔夜大事件</div>';
  h+=list.map(t=>{
    let x='<div class="theme"><div class="th">'+md(t.h);
    if(t.badge) x+='<span class="badge">'+esc(t.badge)+'</span>';
    x+='</div><div class="tb">'+md(t.body)+'</div>';
    if(t.stk) x+='<div class="stk">'+md(t.stk)+'</div>';
    return x+'</div>';
  }).join('');
  return h+'</div>';
}
/* 行业轮动模块 */
function renderRotation(r){
  if(!r) return '';
  const row=(x,showNf)=>'<div class="rot-row '+(x.cls||'flat')+'"><span class="rot-n">'+esc(x.n)+'</span><span class="rot-v">'+md(x.v)+'</span>'+(showNf&&x.nf?'<span class="rot-nf">主力'+esc(x.nf)+'</span>':'')+'</div>';
  let h='<div class="rot"><div class="ch zhong">行业轮动 · '+esc(r.ts||'')+'</div>';
  h+='<div class="rot-sub">数据源：'+esc(r.src||'东方财富妙想')+' · 红涨绿跌(申万一级)</div>';
  let cols='';
  if(r.top&&r.top.length) cols+='<div class="rot-col"><div class="rot-h up">领涨 Top</div>'+r.top.map(x=>row(x,true)).join('')+'</div>';
  if(r.bottom&&r.bottom.length) cols+='<div class="rot-col"><div class="rot-h down">领跌 Top</div>'+r.bottom.map(x=>row(x,true)).join('')+'</div>';
  h+='<div class="rot-grid">'+cols+'</div>';
  if((r.inflow&&r.inflow.length)||(r.outflow&&r.outflow.length)){
    let c2='';
    if(r.inflow&&r.inflow.length) c2+='<div class="rot-col"><div class="rot-h">主力净流入</div>'+r.inflow.map(x=>row(x,false)).join('')+'</div>';
    if(r.outflow&&r.outflow.length) c2+='<div class="rot-col"><div class="rot-h">主力净流出</div>'+r.outflow.map(x=>row(x,false)).join('')+'</div>';
    h+='<div class="rot-grid">'+c2+'</div>';
  }
  if(r.note) h+='<div class="note">'+md(r.note)+'</div>';
  return h+'</div>';
}
function renderModule(key, m){
  const names={panqian:'盘前',panzhong:'盘中',panhou:'盘后',gold:'黄金跟踪'};
  if(!m) return '<div class="empty">【'+(names[key]||key)+'】未更新 · 待产出</div>';
  if(key==='gold'){ return renderGold(m); }
  if(key==='panqian'){
    let h='';
    if(m.tldr) h+=renderTldr(m.tldr);
    if(m.position) h+=renderPosition(m.position);
    if(m.panorama) h+=renderPanorama(m.panorama);
    else if(m.usMarket) h+=renderUsMarket(m.usMarket);
    if(m.overnight) h+=renderOvernight(m.overnight);
    else if(m.events && m.events.length) h+=renderEvents(m.events);
    if(m.dapan) h+=renderDapan(m.dapan);
    if(m.watch && m.watch.length) h+=renderWatch(m.watch);
    if(m.rotation) h+=renderRotation(m.rotation);
    if(m.blocks) h+=m.blocks.map(renderBlock).join('');
    return h;
  }
  let h='';
  if(m.marketOverview) h+=renderMarketOverview(m.marketOverview);
  if(m.rotation) h+=renderRotation(m.rotation);
  if(m.blocks) h+=m.blocks.map(renderBlock).join('');
  return h;
}
/* 状态 */
let curId = null, curMod = null;
const order=Object.keys(DAYS).sort().reverse();
function defaultMod(d){ if(d.panhou) return 'panhou'; if(d.panzhong) return 'panzhong'; return 'panqian'; }
function renderNav(cur){
  return order.map(id=>'<button class="dbtn '+(id===cur?'active':'')+'" onclick="sel(\''+id+'\')">'+(id.slice(5).replace(/-/g,'/'))+'</button>').join('');
}
function renderTabs(d){
  const mods=[['panqian','盘前'],['panzhong','盘中'],['panhou','盘后'],['gold','黄金']];
  return '<div class="tabs">'+mods.map(([k,n])=>{
    const ex=!!d[k]; const act=k===curMod;
    return '<button class="tab '+(act?'active':'')+(ex?'':' disabled')+'" data-k="'+k+'" '+(ex?'onclick="selmod(\''+k+'\')"':'')+'>'+n+(ex?'':' · 未更新')+'</button>';
  }).join('')+'</div>';
}
function renderDay(id){
  const d=DAYS[id];
  let html='<div class="hero"><span class="tag">A股每日复盘</span><h2>'+id+' '+d.weekday+' · '+md(d.tagline)+'</h2></div>';
  html+='<div class="tags">'+d.tags.map(t=>'<span class="pill">'+esc(t)+'</span>').join('')+'</div>';
  html+=renderTabs(d);
  html+='<div class="mod">'+renderModule(curMod, d[curMod])+'</div>';
  return html;
}
function sel(id){
  curId=id; curMod=defaultMod(DAYS[id]);
  document.getElementById('content').innerHTML=renderDay(id);
  document.getElementById('nav').innerHTML=renderNav(id);
  window.scrollTo({top:0,behavior:'smooth'});
}
function selmod(k){
  curMod=k;
  document.getElementById('content').innerHTML=renderDay(curId);
}
curId=order[0]; curMod=defaultMod(DAYS[curId]);
document.getElementById('nav').innerHTML=renderNav(curId);
document.getElementById('content').innerHTML=renderDay(curId);
</script>
